# ============================================================
# Argo Rollouts - Canary 灰度发布
# 包含：Rollout + Stable Service + Canary Service
# ============================================================

apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: go-k8s-demo
  labels:
    app: go-k8s-demo
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: go-k8s-demo
  template:
    metadata:
      labels:
        app: go-k8s-demo
    spec:
      containers:
        - name: go-app
          # 云效流水线会将 ${IMAGE} 替换为实际构建的镜像地址
          image: crpi-qog7f6f2a152sq41.cn-shanghai.personal.cr.aliyuncs.com/test20260603/golang:2026061204
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
  strategy:
    canary:
      canaryService: go-k8s-demo-canary-svc
      stableService: go-k8s-demo-svc
      steps:
        - setWeight: 10
        - pause: { duration: 2m }
        - setWeight: 30
        - pause: { duration: 2m }
        - setWeight: 60
        - pause: { duration: 2m }
        - setWeight: 100

---
# Stable Service（承接稳定版流量）
apiVersion: v1
kind: Service
metadata:
  name: go-k8s-demo-svc
  labels:
    app: go-k8s-demo
spec:
  selector:
    app: go-k8s-demo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP

---
# Canary Service（承接灰度版流量）
apiVersion: v1
kind: Service
metadata:
  name: go-k8s-demo-canary-svc
  labels:
    app: go-k8s-demo
spec:
  selector:
    app: go-k8s-demo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
