# ============================================================
# 1. 命名空间（含 Istio Sidecar 自动注入标签）
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: go-k8s-demo
  labels:
    istio-injection: enabled

---
# ============================================================
# 2. Argo Rollouts - Canary 灰度发布（集成 Istio）
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: go-k8s-demo
  namespace: go-k8s-demo
  labels:
    app: go-k8s-demo
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: go-k8s-demo
  template:
    metadata:
      labels:
        app: go-k8s-demo
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: go-app
          image: crpi-qog7f6f2a152sq41.cn-shanghai.personal.cr.aliyuncs.com/test20260603/golang:2026090904
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
  strategy:
    canary:
      canaryService: go-k8s-demo-canary
      stableService: go-k8s-demo-svc

      trafficRouting:
        istio:
          virtualServices:
            - name: go-k8s-demo-vsvc
              routes:
                - primary
      steps:
        - setWeight: 10
        - pause: { duration: 2m }
        - setWeight: 30
        - pause: { duration: 2m }
        - setWeight: 60
        - pause: { duration: 2m }
        - setWeight: 100

---
# ============================================================
# 3. Istio Gateway（✅ 新增：入口网关）
# ============================================================
# ⚠️ 注意：port.number 必须是 8080，与 istio-ingressgateway Pod
# 容器实际监听的端口一致（可通过 istioctl proxy-config listeners 确认）。
# 对外访问端口由 istio-ingressgateway Service 的 NodePort 决定（如 30599 -> 8080）。
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: go-k8s-demo-gateway
  namespace: go-k8s-demo
spec:
  selector:
    istio: ingressgateway        # 匹配 istio-ingressgateway Pod 的标签
  servers:
    - port:
        number: 8080             # ✅ 必须与 Ingress Gateway Pod 监听端口一致
        name: http
        protocol: HTTP
      hosts:
        - go-k8s-demo-svc
        - go-k8s-demo-canary

---
# ============================================================
# 4. Istio VirtualService（Argo Rollouts 动态调整权重）
# ============================================================
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: go-k8s-demo-vsvc
  namespace: go-k8s-demo
spec:
  hosts:
    - go-k8s-demo-svc
    - go-k8s-demo-canary
  gateways:                      # ✅ 新增：绑定到 Gateway
    - go-k8s-demo-gateway        # 同命名空间下直接用名称即可
  http:
    - name: primary              # ⚠️ 此名称必须与 Rollout 中 routes 指定的一致
      route:
        - destination:
            host: go-k8s-demo-svc
            port:
              number: 80
          weight: 100
        - destination:
            host: go-k8s-demo-canary
            port:
              number: 80
          weight: 0

---
# ============================================================
# 5. Stable Service (根服务/稳定版)
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: go-k8s-demo-svc
  namespace: go-k8s-demo
  labels:
    app: go-k8s-demo
spec:
  selector:
    app: go-k8s-demo
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP

---
# ============================================================
# 6. Canary Service
# ============================================================
# Argo Rollouts 控制器会自动修改这个 Service 的 Endpoints，
# 使其只指向带有特定 hash 的 Canary Pods。
apiVersion: v1
kind: Service
metadata:
  name: go-k8s-demo-canary
  namespace: go-k8s-demo
  labels:
    app: go-k8s-demo
spec:
  selector:
    app: go-k8s-demo
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
