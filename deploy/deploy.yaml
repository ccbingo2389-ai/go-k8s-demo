# ============================================================
# 1. 命名空间（含 Istio Sidecar 自动注入标签）
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: go-k8s-demo
  labels:
    istio-injection: enabled

---
# ============================================================
# 2. Argo Rollouts - Canary 灰度发布（集成 Istio）
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: go-k8s-demo
  namespace: go-k8s-demo
  labels:
    app: go-k8s-demo
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: go-k8s-demo
  template:
    metadata:
      labels:
        app: go-k8s-demo
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: go-app
          image: crpi-qog7f6f2a152sq41.cn-shanghai.personal.cr.aliyuncs.com/test20260603/golang:2026061208
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
  strategy:
    canary:
      # ✅ 【修复点 1】必须显式指定 canaryService，Rollouts 不会自动创建 Service 资源
      canaryService: go-k8s-demo-canary
      stableService: go-k8s-demo-svc
      
      trafficRouting:
        istio:
          virtualServices:
            - name: go-k8s-demo-vsvc
              routes:
                - primary
      steps:
        - setWeight: 10
        - pause: { duration: 2m }
        - setWeight: 30
        - pause: { duration: 2m }
        - setWeight: 60
        - pause: { duration: 2m }
        - setWeight: 100

---
# ============================================================
# 3. Istio VirtualService（Argo Rollouts 动态调整权重）
# ============================================================
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: go-k8s-demo-vsvc
  namespace: go-k8s-demo
spec:
  hosts:
    - go-k8s-demo-svc
    - go-k8s-demo-canary       
  http:
    - name: primary
      route:
        - destination:
            host: go-k8s-demo-svc
            port:
              number: 80
          weight: 100
        - destination:
            host: go-k8s-demo-canary   
            port:
              number: 80
          weight: 0

---
# ============================================================
# 4. Stable Service (根服务/稳定版)
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: go-k8s-demo-svc
  namespace: go-k8s-demo
  labels:
    app: go-k8s-demo
spec:
  selector:
    app: go-k8s-demo
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP

---
# ============================================================
# 5. Canary Service (✅ 【修复点 2】必须手动创建此 Service)
# ============================================================
# 注意：虽然 selector 和 stable service 一样，但 Argo Rollouts 控制器
# 会自动修改这个 Service 的 Endpoints，使其只指向带有特定 hash 的 Canary Pods。
apiVersion: v1
kind: Service
metadata:
  name: go-k8s-demo-canary
  namespace: go-k8s-demo
  labels:
    app: go-k8s-demo
spec:
  selector:
    app: go-k8s-demo
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
  # Canary Service 通常不需要 NodePort，除非你要直接调试它
  type: ClusterIP 
