apiVersion: v1
kind: Namespace
metadata:
  name: go-k8s-demo
  labels:
    istio.io/dataplane-mode: ambient   # ← 改为 Ambient 标签
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: go-k8s-demo
  namespace: go-k8s-demo
  labels:
    app: go-k8s-demo
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: go-k8s-demo
  template:
    metadata:
      labels:
        app: go-k8s-demo
        # ← 已移除 sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: go-app
          image: crpi-qog7f6f2a152sq41.cn-shanghai.personal.cr.aliyuncs.com/test20260603/golang:2026061206
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
  strategy:
    canary:
      stableService: go-k8s-demo-svc
      canaryService: go-k8s-demo-canary-svc
      trafficRouting:
        istio:
          virtualServices:
            - name: go-k8s-demo-vsvc
              routes:
                - primary
      steps:
        - setWeight: 10
        - pause: { duration: 2m }
        - setWeight: 30
        - pause: { duration: 2m }
        - setWeight: 60
        - pause: { duration: 2m }
        - setWeight: 100
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: go-k8s-demo-vsvc
  namespace: go-k8s-demo
spec:
  hosts:
    - go-k8s-demo-svc
    - go-k8s-demo-canary-svc
  http:
    - name: primary
      route:
        - destination:
            host: go-k8s-demo-svc
            port:
              number: 80
          weight: 100
        - destination:
            host: go-k8s-demo-canary-svc
            port:
              number: 80
          weight: 0
---
apiVersion: v1
kind: Service
metadata:
  name: go-k8s-demo-svc
  namespace: go-k8s-demo
  labels:
    app: go-k8s-demo
spec:
  selector:
    app: go-k8s-demo
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: go-k8s-demo-canary-svc
  namespace: go-k8s-demo
  labels:
    app: go-k8s-demo
spec:
  selector:
    app: go-k8s-demo
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
