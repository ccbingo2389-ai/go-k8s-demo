# ============================================================
# 1. 命名空间（含 Istio Sidecar 自动注入标签）
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: go-k8s-demo
  labels:
    istio-injection: enabled   # ← 启用 Sidecar 自动注入

---
# ============================================================
# 2. Argo Rollouts - Canary 灰度发布（集成 Istio）
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: go-k8s-demo
  namespace: go-k8s-demo       # ← 指定新命名空间
  labels:
    app: go-k8s-demo
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: go-k8s-demo
  template:
    metadata:
      labels:
        app: go-k8s-demo
      annotations:
        sidecar.istio.io/inject: "true"   # ← Pod 级注入保险
    spec:
      containers:
        - name: go-app
          image: crpi-qog7f6f2a152sq41.cn-shanghai.personal.cr.aliyuncs.com/test20260603/golang:2026061208
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
  strategy:
    canary:
      stableService: go-k8s-demo-svc
      canaryService: go-k8s-demo-canary-svc
      # ✅ Istio 流量路由配置（必须与 VirtualService 联动）
      trafficRouting:
        istio:
          virtualServices:
            - name: go-k8s-demo-vsvc
              routes:
                - primary
      steps:
        - setWeight: 10
        - pause: { duration: 2m }
        - setWeight: 30
        - pause: { duration: 2m }
        - setWeight: 60
        - pause: { duration: 2m }
        - setWeight: 100

---
# ============================================================
# 3. Istio VirtualService（Argo Rollouts 动态调整权重）
# ============================================================
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: go-k8s-demo-vsvc
  namespace: go-k8s-demo
spec:
  hosts:
    - go-k8s-demo-svc
    - go-k8s-demo-canary-svc
  http:
    - name: primary             # ← 必须与 Rollout routes 名称一致
      route:
        - destination:
            host: go-k8s-demo-svc
            port:
              number: 80
          weight: 100           # 初始值，Argo Rollouts 会自动覆盖
        - destination:
            host: go-k8s-demo-canary-svc
            port:
              number: 80
          weight: 0

---
# ============================================================
# 4. Stable Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: go-k8s-demo-svc
  namespace: go-k8s-demo
  labels:
    app: go-k8s-demo
spec:
  selector:
    app: go-k8s-demo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP

---
# ============================================================
# 5. Canary Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: go-k8s-demo-canary-svc
  namespace: go-k8s-demo
  labels:
    app: go-k8s-demo
spec:
  selector:
    app: go-k8s-demo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
