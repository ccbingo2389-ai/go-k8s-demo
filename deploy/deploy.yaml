apiVersion: v1
kind: Namespace
metadata:
  name: go-k8s-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-k8s-demo
  namespace: go-k8s-demo
  labels:
    app: go-k8s-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-k8s-demo
  template:
    metadata:
      labels:
        app: go-k8s-demo
    spec:
      containers:
        - name: go-app
          # 此处的镜像地址请根据实际情况替换，云效流水线会自动处理 ${IMAGE}
          image: crpi-qog7f6f2a152sq41.cn-shanghai.personal.cr.aliyuncs.com/test20260603/golang:2026061209
          env:
            # 指向集群内的 SigNoz OTel Collector
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://signoz-otel-collector.signoz.svc.cluster.local:4318"
            # 在 SigNoz UI 中显示的服务名称
            - name: OTEL_SERVICE_NAME
              value: "go-k8s-demo"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: go-k8s-demo-svc
  namespace: go-k8s-demo
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30881  # 使用 30881 避免与 hotrod 的 30880 冲突
  selector:
    app: go-k8s-demo
