# ============================================================
# 1. 命名空间（含 Istio Sidecar 自动注入标签）
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: go-k8s-demo
  labels:
    istio-injection: enabled

---
# ============================================================
# 2. Argo Rollouts - Canary 灰度发布（集成 Istio）
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: go-k8s-demo
  namespace: go-k8s-demo
  labels:
    app: go-k8s-demo
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: go-k8s-demo
  template:
    metadata:
      labels:
        app: go-k8s-demo
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: go-app
          image: crpi-qog7f6f2a152sq41.cn-shanghai.personal.cr.aliyuncs.com/test20260603/golang:2026061208
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
  strategy:
    canary:
      stableService: go-k8s-demo-svc
      canaryService: go-k8s-demo-canary-svc
      trafficRouting:
        istio:
          virtualServices:
            - name: go-k8s-demo-vsvc
              routes:
                - primary
      steps:
        - setWeight: 10
        - pause: { duration: 2m }
        - setWeight: 30
        - pause: { duration: 2m }
        - setWeight: 60
        - pause: { duration: 2m }
        - setWeight: 100

---
# ============================================================
# 3. Istio VirtualService（绑定 Gateway + HTTPS 域名）
# ============================================================
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: go-k8s-demo-vsvc
  namespace: go-k8s-demo
spec:
  gateways:
    - istio-system/go-k8s-demo-gateway
    - mesh
  hosts:
    - "demo.howaimath.cn"
  http:
    - name: primary
      route:
        - destination:
            host: go-k8s-demo-svc
            port:
              number: 80
          weight: 100
        - destination:
            host: go-k8s-demo-canary-svc
            port:
              number: 80
          weight: 0

---
# ============================================================
# 4. Stable Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: go-k8s-demo-svc
  namespace: go-k8s-demo
  labels:
    app: go-k8s-demo
spec:
  selector:
    app: go-k8s-demo
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP

---
# ============================================================
# 5. Canary Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: go-k8s-demo-canary-svc
  namespace: go-k8s-demo
  labels:
    app: go-k8s-demo
spec:
  selector:
    app: go-k8s-demo
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP

---
# ============================================================
# 6. Istio Gateway（HTTP → HTTPS 自动跳转 + TLS 终止）✅ 已升级
# ============================================================
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: go-k8s-demo-gateway
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
    # HTTP 监听 → 自动 301 跳转到 HTTPS
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "demo.howaimath.cn"
      tls:
        httpsRedirect: true
    # HTTPS 监听 → TLS 终止在 Istio Gateway
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - "demo.howaimath.cn"
      tls:
        mode: SIMPLE
        credentialName: demo-howaimath-cn-tls   # ← 引用 istio-system 下的 Secret
